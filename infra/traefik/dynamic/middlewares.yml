http:
  middlewares:
    auth-admin:
      basicAuth:
        usersFile: /etc/traefik/dynamic/.htpasswd
    secure-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        contentTypeNosniff: true
        frameDeny: true
        referrerPolicy: "strict-origin-when-cross-origin"
